status.endfield-industry-lib-basic-industry-phase1.description=[#91d5e8]基础工业计划的第一阶段。[][cyan]基础矿物采掘[]、[cyan]基础运输[]、[cyan]基础精炼[]、[cyan]基础供电[]等基础技术。
status.endfield-industry-lib-basic-industry-phase2.name=基础工业二期
status.endfield-industry-lib-basic-industry-phase2.description=[#b5e2f0]基础工业计划的第二阶段。[][cyan]培植工艺[]、[cyan]封装工艺[]、[cyan]传送带分流[]等进阶技术。
status.endfield-industry-lib-basic-industry-phase3.name=基础工业三期
status.endfield-industry-lib-basic-industry-phase3.description=[#d4f0f7]基础工业计划的第三阶段。[][cyan]研磨工艺[]、[cyan]传送带汇流[]等高级技术。
status.endfield-industry-lib-basic-mineral-mining.name=基础矿物采掘
status.endfield-industry-lib-basic-mineral-mining.description=研究后可制造[cyan]便携源石矿机[]；便携源石矿机可开采矿物且无需电力。[gray]典型矿物为[#ffd700]源矿[]。
status.endfield-industry-lib-intermediate-mineral-mining.name=中级矿物采掘
status.endfield-industry-lib-intermediate-mineral-mining.description=研究后可制造[cyan]电驱矿机[]；电驱矿机可在野外无线传输矿物至仓库。[gray]可采集更稀有的矿藏，典型矿物为[#a55fc4]紫晶矿[]。
status.endfield-industry-lib-advanced-mineral-mining.name=高级矿物采掘
status.endfield-industry-lib-advanced-mineral-mining.description=研究后可制造[cyan]二型电驱矿机[]；二型电驱矿机可在野外无线传输矿物至仓库。[gray]可采集更稀有的矿藏，典型矿物为[#4f7ebf]蓝铁矿[]。
status.endfield-industry-lib-basic-transport.name=基础运输
status.endfield-industry-lib-basic-transport.description=研究后可解锁[cyan]传送带[]的使用权限；传送带可将货物自动从设备输出口输送到下个设备的输入口。
status.endfield-industry-lib-item-access-port.name=物品准入口
status.endfield-industry-lib-item-access-port.description=研究后可解锁[cyan]物品准入口[]的使用权限；物品准入口可限制传送带上允许通过的物品，并限制可通过的数量。
status.endfield-industry-lib-belt-splitting.name=传送带分流
status.endfield-industry-lib-belt-splitting.description=研究后可解锁[cyan]分流器[]的使用权限；分流器可将单一传送带分流出最多[orange]3[]条传送带进行传输。
status.endfield-industry-lib-belt-bridging.name=传送带跨接
status.endfield-industry-lib-belt-bridging.description=研究后可解锁[cyan]物流桥[]的使用权限；物流桥可使得两条交叉传送带进行传输而互不影响。
status.endfield-industry-lib-belt-converging.name=传送带汇流
status.endfield-industry-lib-belt-converging.description=研究后可解锁[cyan]汇流器[]的使用权限；汇流器可将最多[orange]3[]条传送带并入[orange]1[]条传送带进行传输。
status.endfield-industry-lib-basic-refining.name=基础精炼
status.endfield-industry-lib-basic-refining.description=研究后可制造[cyan]精炼炉[]；精炼炉可将材料进行精炼。[gray]典型产物为[#ffd700]晶体外壳[]。
status.endfield-industry-lib-item-moulding.name=物品塑形
status.endfield-industry-lib-item-moulding.description=研究后可制造[cyan]塑形机[]；塑形机可将材料进行塑形。[gray]典型产物为[#a55fc4]紫晶质瓶[]。
status.endfield-industry-lib-filler.name=灌装机
status.endfield-industry-lib-filler.description=研究后可制造[cyan]灌装机[]；灌装机可将材料进行灌装。[gray]典型产物为[#ff6b6b]荞愈胶囊[]和[#ff6b6b]柑实罐头[]。
status.endfield-industry-lib-cultivation-technology.name=培植工艺
status.endfield-industry-lib-cultivation-technology.description=研究后可制造[cyan]采种机[]与[cyan]种植机[]；采种机可将普通植物进行采种，可产出对应植物的种子；种植机可将普通种子进行种植，可产出对应植物成株。
status.endfield-industry-lib-grinding-tech.name=研磨工艺
status.endfield-industry-lib-grinding-tech.description=研究后可制造[cyan]研磨机[]；研磨机可将材料进行研磨。[gray]典型产物为[#ffd700]致密源石粉末[]。
status.endfield-industry-lib-basic-shredding.name=基础粉碎
status.endfield-industry-lib-basic-shredding.description=研究后可制造[cyan]粉碎机[]；粉碎机可将材料进行粉碎。[gray]典型产物为[#ffd700]晶体外壳粉末[]。
status.endfield-industry-lib-parts-manufacturing.name=零件制造
status.endfield-industry-lib-parts-manufacturing.description=研究后可制造[cyan]配件机[]；配件机可将材料进行配件。[gray]典型产物为[#a55fc4]紫晶零件[]。
status.endfield-industry-lib-packaging-tech.name=封装工艺
status.endfield-industry-lib-packaging-tech.description=研究后可制造[cyan]封装机[]；封装机可将材料进行封装。[gray]典型产物为[#7dcea0]低容谷地电池[]与[#ff9300]工业爆炸物[]。
status.endfield-industry-lib-basic-power.name=基础供电
status.endfield-industry-lib-basic-power.description=研究后可制造[cyan]供电桩[]；供电桩可在通电后为范围内的设备进行供电。
status.endfield-industry-lib-power-transmission.name=电力传输
status.endfield-industry-lib-power-transmission.description=研究后可制造[cyan]中继器[]；中继器可在更大范围内进行电路连接，但无法为范围内设备供电。
status.endfield-industry-lib-power-generation.name=基础发电
status.endfield-industry-lib-power-generation.description=研究后可制造[cyan]热能池[]；热能池可消耗[#ffd700]源矿[]或[#7dcea0]电池[]进行发电，但需要接入电网整流后才能工作。
status.endfield-industry-lib-warehouse-access.name=仓库存取线
status.endfield-industry-lib-warehouse-access.description=研究后可解锁仓库存取线的升级权限。[gray]可使用仓库存取线将物品取出或存入仓库，可制造[cyan]仓库存货口[]与[cyan]仓库取货口[]。
status.endfield-industry-lib-outdoor-storage.name=户外储物技术
status.endfield-industry-lib-outdoor-storage.description=研究后可制造[cyan]协议储存箱[]；协议储存箱可存放物品，并在通电后可以将储存物品以一定间隔传输回仓库。
status.endfield-industry-lib-defense-i.name=Defense I
status.endfield-industry-lib-defense-i.description=Allows manufacturing of the [cyan]Gun Tower[]; automatically attacks enemies within range when powered.
status.endfield-industry-lib-area-denial-i.name=Area Denial I
status.endfield-industry-lib-area-denial-i.description=Allows manufacturing of the [cyan]Grenade Tower[]; deals area damage to enemies within range when powered.
status.endfield-industry-lib-gearing-tech.name=Gearing Tech
status.endfield-industry-lib-gearing-tech.description=Allows manufacturing of Gearing Units for assembling materials into components.
status.endfield-industry-lib-pylon-relaying.name=Pylon Relaying
status.endfield-industry-lib-pylon-relaying.description=Unlocks the power transmission feature of Electric Pylons.
status.endfield-industry-lib-relay-redistribution.name=Relay Redistribution
status.endfield-industry-lib-relay-redistribution.description=Unlocks the area power supply feature of Relay Towers.
status.endfield-industry-lib-custom-defense-i.name=Custom Defense I
status.endfield-industry-lib-custom-defense-i.description=Allows manufacturing of [cyan]Heavy Gun Towers[]; automatically attacks enemies within range when powered.
status.endfield-industry-lib-custom-defense-ii.name=Custom Defense II
status.endfield-industry-lib-custom-defense-ii.description=Allows manufacturing of [cyan]Sentry Towers[]; automatically attacks enemies within a substantial range.
status.endfield-industry-lib-hostile-control-i.name=Hostile Control I
status.endfield-industry-lib-hostile-control-i.description=Allows manufacturing of [cyan]LN Towers[]; slows down enemies within range when powered.
status.endfield-industry-lib-hostile-control-ii.name=Hostile Control II
status.endfield-industry-lib-hostile-control-ii.description=Allows manufacturing of [cyan]Omnidirectional Sonic Towers[]; periodically stuns enemies within the area of effect.
status.endfield-industry-lib-point-defense-i.name=Point Defense I
status.endfield-industry-lib-point-defense-i.description=Allows manufacturing of [cyan]Beam Towers[]; automatically attacks enemies within range when powered.
status.endfield-industry-lib-area-denial-ii.name=Area Denial II
status.endfield-industry-lib-area-denial-ii.description=Allows manufacturing of [cyan]Surge Towers[]; attacks hit multiple targets within range when powered.
status.endfield-industry-lib-wilderness-aid.name=Wilderness Aid
status.endfield-industry-lib-wilderness-aid.description=Allows manufacturing of [cyan]Medical Towers[]; restores HP of active operators when powered.
status.endfield-industry-lib-memo-beacon-tech.name=Memo Beacon Technology
status.endfield-industry-lib-memo-beacon-tech.description=Allows manufacturing of [cyan]Memo Beacons[]; can be used to post and leave beacon memos.
status.endfield-industry-lib-protocol-transfer-tech.name=Protocol Transfer Technology
status.endfield-industry-lib-protocol-transfer-tech.description=Allows manufacturing of [cyan]Easy Stashes[]; remotely transfers items to and from the Depot when powered.
status.endfield-industry-lib-field-mobility-i.name=Field Mobility I
status.endfield-industry-lib-field-mobility-i.description=Allows manufacturing of [cyan]Zipline Pylons[]; create a zipline for quick travel between two pylons.
status.endfield-industry-lib-field-mobility-ii.name=Field Mobility II
status.endfield-industry-lib-field-mobility-ii.description=Allows manufacturing of [cyan]Zipline Towers[]; create longer ziplines for greater distances.
status.endfield-industry-lib-region-hub.name=枢纽区
status.endfield-industry-lib-originium-research-lab.name=源石研究所
status.endfield-industry-lib-vein-source-area.name=矿脉源区
status.endfield-industry-lib-energy-highland.name=供能高地
status.endfield-industry-lib-quarry.name=采石场
status.endfield-industry-lib-items-category.name=物品

#星球
# 塔罗斯 (Talos)
planet.endfield-industry-lib-talos.name = Talos
planet.endfield-industry-lib-talos.description = 一颗巨大的气态行星，散发着幽蓝的光芒。
planet.endfield-industry-lib-talos.details = 它的引力统治着整个星系，是塔卫二的母星。

# 塔卫二 (Taelos II)
techtree.taelos-II = Taelos II
planet.endfield-industry-lib-taelos-II.name = Taelos II
planet.endfield-industry-lib-taelos-II.description = 环绕塔罗斯运行的岩石卫星。
planet.endfield-industry-lib-taelos-II.details = 地表炎热干燥，蕴藏着丰富的矿产资源。
